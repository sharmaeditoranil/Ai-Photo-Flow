<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Squircle Gradient -->
    <linearGradient id="squircleBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e2430" />
      <stop offset="50%" stop-color="#11141a" />
      <stop offset="100%" stop-color="#080a0d" />
    </linearGradient>

    <!-- Outer Rim Gradient -->
    <linearGradient id="rimGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>

    <!-- Lens Glass Reflection Gradient -->
    <linearGradient id="glassReflect" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.35" />
      <stop offset="35%" stop-color="#38bdf8" stop-opacity="0.15" />
      <stop offset="70%" stop-color="#000000" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0.2" />
    </linearGradient>

    <!-- Cyan AI Glow -->
    <linearGradient id="aiCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#67e8f9" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <!-- Warm Amber Flow -->
    <linearGradient id="warmAmber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="coreGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Dark Rounded Container (Squircle) -->
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#squircleBg)" stroke="rgba(255, 255, 255, 0.12)" stroke-width="3" />

  <!-- Outer Metallic Lens Ring -->
  <circle cx="256" cy="256" r="192" fill="none" stroke="url(#rimGrad)" stroke-width="4" stroke-opacity="0.8" />
  <circle cx="256" cy="256" r="182" fill="#0d1117" stroke="rgba(255,255,255,0.06)" stroke-width="2" />

  <!-- Lens Element Shading -->
  <circle cx="256" cy="256" r="172" fill="url(#glassReflect)" />

  <!-- Aperture Blades / Dynamic Flow Vortex -->
  <g stroke="rgba(255,255,255,0.12)" stroke-width="1.5">
    <!-- Blade 1 Cyan -->
    <path d="M 256 100 A 156 156 0 0 1 390 190 L 320 230 A 90 90 0 0 0 256 170 Z" fill="url(#aiCyan)" opacity="0.85" />
    <!-- Blade 2 Cyan to Gold Transition -->
    <path d="M 390 190 A 156 156 0 0 1 405 320 L 330 290 A 90 90 0 0 0 320 230 Z" fill="#38bdf8" opacity="0.75" />
    <!-- Blade 3 Warm Amber (Wedding Tone) -->
    <path d="M 405 320 A 156 156 0 0 1 310 405 L 280 330 A 90 90 0 0 0 330 290 Z" fill="url(#warmAmber)" opacity="0.9" />
    <!-- Blade 4 Warm Golden Flow -->
    <path d="M 310 405 A 156 156 0 0 1 180 395 L 210 325 A 90 90 0 0 0 280 330 Z" fill="#f59e0b" opacity="0.8" />
    <!-- Blade 5 Deep Indigo/Cyan -->
    <path d="M 180 395 A 156 156 0 0 1 110 295 L 185 265 A 90 90 0 0 0 210 325 Z" fill="#0ea5e9" opacity="0.7" />
    <!-- Blade 6 Top Left Spark Flow -->
    <path d="M 110 295 A 156 156 0 0 1 145 165 L 215 215 A 90 90 0 0 0 185 265 Z" fill="#38bdf8" opacity="0.8" />
  </g>

  <!-- Aperture Inner Ring -->
  <circle cx="256" cy="256" r="68" fill="#090d14" stroke="rgba(255,255,255,0.2)" stroke-width="2" />

  <!-- Center AI Sparkle (4-point star) -->
  <g filter="url(#coreGlow)">
    <!-- Primary Center Star -->
    <path d="M 256 210 Q 256 256 210 256 Q 256 256 256 302 Q 256 256 302 256 Q 256 256 256 210 Z" fill="#ffffff" />
    <!-- Minor Star (top right) -->
    <path d="M 305 200 Q 305 218 287 218 Q 305 218 305 236 Q 305 218 323 218 Q 305 218 305 200 Z" fill="#67e8f9" />
    <!-- Minor Star (bottom left) -->
    <path d="M 205 295 Q 205 310 190 310 Q 205 310 205 325 Q 205 310 220 310 Q 205 310 205 295 Z" fill="#fde047" />
  </g>

  <!-- Curved Lens Reflection Arc -->
  <path d="M 140 180 A 150 150 0 0 1 330 135" fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round" opacity="0.45" />
</svg>
